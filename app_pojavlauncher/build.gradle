plugins {
    id 'com.android.application' version '9.3.1'
    id 'com.android.built-in-kotlin'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

static def getDate() { return new Date().format('yyyyMMdd') }

ext {
    starVersionCode = 10000003
    starVersionName = "3.0.2"
}

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = project.ext.starVersionName
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'star-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def readLocalProperty = { String propName ->
    File localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.canRead() && localPropsFile.isFile()) {
        Properties props = new Properties()
        localPropsFile.withInputStream { props.load(it) }
        String val = props.getProperty(propName)
        if (val != null && !val.trim().isEmpty()) return val.trim()
    }
    if (project.hasProperty(propName)) {
        String propVal = String.valueOf(project.property(propName)).trim()
        if (!propVal.isEmpty()) return propVal
    }
    return null
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null && !key.trim().isEmpty()) return key.trim();
    String localKey = readLocalProperty("CURSEFORGE_API_KEY")
    if(localKey != null && !localKey.isEmpty()) return localKey
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        String fileKey = curseforgeKeyFile.text.trim();
        if(!fileKey.isEmpty()) return fileKey;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

def getCFProxyUrl = {
    String envUrl = System.getenv("STAR_CURSEFORGE_PROXY_URL") ?: System.getenv("CURSEFORGE_PROXY_URL")
    if (envUrl != null && !envUrl.trim().isEmpty()) return envUrl.trim()
    String localUrl = readLocalProperty("STAR_CURSEFORGE_PROXY_URL") ?: readLocalProperty("CURSEFORGE_PROXY_URL")
    if (localUrl != null && !localUrl.isEmpty()) return localUrl
    return ""
}

def resolveSigningProp = { String key ->
    def envVal = System.getenv(key)
    if (envVal != null && !envVal.trim().isEmpty()) return envVal.trim()
    return readLocalProperty(key)
}

def resolveKeystoreFile = { String rawPath ->
    if (rawPath == null || rawPath.trim().isEmpty()) return null
    def direct = new File(rawPath.trim())
    if (direct.isAbsolute()) return direct
    def fromRoot = rootProject.file(rawPath.trim())
    return fromRoot.isFile() ? fromRoot : file(rawPath.trim())
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    def starVersionCode = project.ext.starVersionCode
    def starVersionName = project.ext.starVersionName

    def starKeystorePath = resolveSigningProp("STAR_KEYSTORE_FILE")
    def starKeystorePassword = resolveSigningProp("STAR_KEYSTORE_PASSWORD")
    def starKeyAlias = resolveSigningProp("STAR_KEY_ALIAS")
    def starKeyPassword = resolveSigningProp("STAR_KEY_PASSWORD")
    def starKeystoreFileObj = resolveKeystoreFile(starKeystorePath)
    def hasProductionSigning = starKeystoreFileObj != null &&
        starKeystoreFileObj.isFile() &&
        starKeystorePassword != null &&
        starKeyAlias != null &&
        starKeyPassword != null

    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        customRelease {
            if (starKeystoreFileObj != null) {
                storeFile starKeystoreFileObj
            }
            storePassword starKeystorePassword
            keyAlias starKeyAlias
            keyPassword starKeyPassword
        }
        googlePlayBuild {
            storeFile file("upload.jks")
            storePassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
            keyAlias "upload"
            keyPassword System.getenv("GPLAY_KEYSTORE_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.star.launcher"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode starVersionCode
        versionName starVersionName
        multiDexEnabled true //important
        ndk {
            // Restrict packaged native libraries strictly to the 4 supported ABIs built in Application.mk
            // so transitive AARs (e.g. JNA) do not inject partial armeabi/mips/mips64 directories.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        resValue 'string', 'curseforge_default_proxy_url', getCFProxyUrl()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "STAR Launcher (Debug)"
            resValue "string", "app_short_name", "STAR (Debug)"
            resValue 'string', 'application_package', 'com.star.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.star.launcher.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.star.launcher.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(hasProductionSigning ? signingConfigs.customRelease : null)
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "STAR Launcher"
            resValue "string", "app_short_name", "STAR"
            resValue 'string', 'storageProviderAuthorities', 'com.star.launcher.scoped.gamefolder'
            resValue 'string', 'shareProviderAuthority', 'com.star.launcher.scoped.controlfolder'
            resValue 'string', 'application_package', 'com.star.launcher'
        }
        gplay {
            initWith release
            signingConfig signingConfigs.googlePlayBuild
            matchingFallbacks = [ 'release' ]
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // If you're debugging mesa libs, put them here, android will strip them
            // and not properly link to source files, very smart android studio.
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
        compose true
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "1024m"
                testLogging {
                    events "failed"
                    exceptionFormat = "full"
                }
                def toolchainService = project.extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
                javaLauncher = toolchainService.launcherFor {
                    languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
                }
            }
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
    arg("room.generateKotlin", "true")
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }

    def releaseGuard = { String buildTypeLabel, List<String> missingItems ->
        if (!missingItems.isEmpty()) {
            throw new GradleException(
                "STAR Launcher ${buildTypeLabel} build aborted: production signing credentials are missing or invalid (${missingItems.join(', ')}). " +
                "Release builds never fall back to debug.keystore. Provide the existing STAR production keystore via environment variables, Gradle properties, or local.properties."
            )
        }
    }

    tasks.matching { t ->
        t.name in ["preReleaseBuild", "assembleRelease", "packageRelease", "bundleRelease", "signReleaseBundle"]
    }.configureEach { t ->
        t.doFirst {
            def missing = []
            def ksPath = resolveSigningProp("STAR_KEYSTORE_FILE")
            if (!ksPath) {
                missing << "STAR_KEYSTORE_FILE"
            } else if (!resolveKeystoreFile(ksPath)?.isFile()) {
                missing << "STAR_KEYSTORE_FILE (file not found at configured path)"
            }
            ["STAR_KEYSTORE_PASSWORD", "STAR_KEY_ALIAS", "STAR_KEY_PASSWORD"].each { key ->
                if (!resolveSigningProp(key)) {
                    missing << key
                }
            }
            releaseGuard("release", missing)
        }
    }

    def gplayRequested = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('gplay') }
    tasks.matching { t ->
        t.name in ["assembleGplay", "packageGplay", "bundleGplay", "signGplayBundle", "validateSigningGplay", "writeGplaySigningConfigVersions"] ||
            (gplayRequested && t.name == "preGplayBuild")
    }.configureEach { t ->
        t.doFirst {
            def missing = []
            if (!file("upload.jks").isFile()) {
                missing << "app_pojavlauncher/upload.jks"
            }
            if (!(System.getenv("GPLAY_KEYSTORE_PASSWORD")?.trim())) {
                missing << "GPLAY_KEYSTORE_PASSWORD"
            }
            releaseGuard("gplay", missing)
        }
    }
}

