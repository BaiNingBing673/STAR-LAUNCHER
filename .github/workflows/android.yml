name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [ opened, reopened, synchronize ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-debug:
    runs-on: ubuntu-22.04
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Apply STAR MioLibPatcher overlay if needed
        run: |
          if [ ! -f MioLibPatcher/src/main/java/com/mio/libpatcher/transformer/VulkanSurfaceTransformer.java ]; then
            git -C MioLibPatcher apply ../patches/miolibpatcher-star.patch
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Update language list and read version metadata
        id: meta
        run: |
          set -euo pipefail
          ./scripts/languagelist_updater.sh
          mkdir -p out logs
          VERSION_NAME=$(grep -m1 'starVersionName\s*=' app_pojavlauncher/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 'starVersionCode\s*=' app_pojavlauncher/build.gradle | sed -E 's/.*=\s*([0-9]+).*/\1/')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit and packaging tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p "test_*.py" -v 2>&1 | tee logs/packaging-tests.log
          ./gradlew :MioLibPatcher:test :app_pojavlauncher:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee logs/unit-tests.log

      - name: Report failed test details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = False
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
                  for tc in root.findall('.//testcase'):
                      err = tc.find('failure')
                      if err is None:
                          err = tc.find('error')
                      if err is not None:
                          found = True
                          msg = (err.attrib.get('message') or '').replace('\n', ' ')[:300]
                          stack_head = " | ".join(line.strip() for line in (err.text or "").splitlines()[:10] if line.strip())[:700]
                          print(f"::error file={path}::{tc.attrib.get('classname')}.{tc.attrib.get('name')}: {msg} || {stack_head}")
                          if err.text:
                              print(err.text[:1500])
              except Exception as exc:
                  print(f"::warning file={path}::Failed to parse XML: {exc}")
          if not found and glob.glob('logs/unit-tests.log'):
              with open('logs/unit-tests.log', 'r', errors='replace') as fh:
                  tail = fh.readlines()[-40:]
              print("::error file=logs/unit-tests.log::" + " | ".join(line.strip() for line in tail[-15:] if line.strip()))
          PY
          tail -n 120 logs/unit-tests.log || true

      - name: Download JRE 8 component
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Build Debug APK and package conservative ZIP
        id: package
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --console=plain 2>&1 | tee logs/assemble-debug.log
          mkdir -p out/artifact-debug
          APK_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}-debug.apk"
          ZIP_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}-debug.zip"
          APK_OUT="out/artifact-debug/$APK_NAME"
          ZIP_OUT="out/artifact-debug/$ZIP_NAME"

          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "$APK_OUT"
          (cd out/artifact-debug && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          python3 scripts/package_release_zip.py \
            --apk "$APK_OUT" \
            --apk-sha256 "${APK_OUT}.sha256" \
            --out "$ZIP_OUT" \
            --compression stored

          APK_SHA256=$(awk '{print tolower($1)}' "${APK_OUT}.sha256")
          ZIP_SHA256=$(awk '{print tolower($1)}' "${ZIP_OUT}.sha256")
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify Debug APK metadata, signature, ABIs, and conservative ZIP
        run: |
          set -euo pipefail
          APK_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}-debug.apk"
          ZIP_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}-debug.zip"
          APK_OUT="out/artifact-debug/$APK_NAME"
          ZIP_OUT="out/artifact-debug/$ZIP_NAME"
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
            BUILD_TOOLS_DIR="$SDK_DIR/build-tools/34.0.0"
          fi
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_OUT" | tee logs/debug-badging.txt
          grep -q "package: name='com.star.launcher.debug'" logs/debug-badging.txt
          grep -q "versionCode='${{ steps.meta.outputs.version_code }}'" logs/debug-badging.txt
          grep -q "versionName='${{ steps.meta.outputs.version_name }}'" logs/debug-badging.txt
          grep -q "minSdkVersion:'21'" logs/debug-badging.txt
          grep -q "targetSdkVersion:'34'" logs/debug-badging.txt
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs --verbose "$APK_OUT" | tee logs/debug-apksigner.txt
          unzip -l "$APK_OUT" 'lib/*.so' | tee logs/debug-native-libs.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$abi/libpojavexec.so" logs/debug-native-libs.txt
          done
          python3 scripts/verify_release_package.py \
            --zip "$ZIP_OUT" \
            --expected-apk-name "$APK_NAME" \
            --expected-apk-sha256 "${{ steps.package.outputs.apk_sha256 }}" \
            --expected-package "com.star.launcher.debug" \
            --apksigner "$BUILD_TOOLS_DIR/apksigner" \
            --aapt2 "$BUILD_TOOLS_DIR/aapt2" | tee logs/debug-zip-verify.txt

      - name: Upload Debug APK, conservative ZIP, and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: STAR-Launcher-v${{ steps.meta.outputs.version_name }}-debug
          path: out/artifact-debug/
          if-no-files-found: error

      - name: Upload Debug & Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-test-logs
          path: |
            logs/
            MioLibPatcher/build/reports/tests/
            app_pojavlauncher/build/reports/tests/

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_sha256: ${{ steps.package.outputs.apk_sha256 }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Apply STAR MioLibPatcher overlay if needed
        run: |
          if [ ! -f MioLibPatcher/src/main/java/com/mio/libpatcher/transformer/VulkanSurfaceTransformer.java ]; then
            git -C MioLibPatcher apply ../patches/miolibpatcher-star.patch
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version and tag consistency
        id: meta
        run: |
          set -euo pipefail
          mkdir -p out logs
          VERSION_NAME=$(grep -m1 'starVersionName\s*=' app_pojavlauncher/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 'starVersionCode\s*=' app_pojavlauncher/build.gradle | sed -E 's/.*=\s*([0-9]+).*/\1/')
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$VERSION_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match starVersionName=$VERSION_NAME"
              exit 1
            fi
          fi

      - name: Run packaging verification tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p "test_*.py" -v 2>&1 | tee logs/release-packaging-tests.log

      - name: Validate production signing secrets and decode keystore
        env:
          STAR_KEYSTORE_BASE64: ${{ secrets.STAR_KEYSTORE_BASE64 }}
          STAR_KEYSTORE_PASSWORD: ${{ secrets.STAR_KEYSTORE_PASSWORD }}
          STAR_KEY_ALIAS: ${{ secrets.STAR_KEY_ALIAS }}
          STAR_KEY_PASSWORD: ${{ secrets.STAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var_name in STAR_KEYSTORE_BASE64 STAR_KEYSTORE_PASSWORD STAR_KEY_ALIAS STAR_KEY_PASSWORD; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::Missing required production signing secret: $var_name. Release builds never fall back to debug signing."
              exit 1
            fi
          done
          printf '%s' "$STAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/star-release.jks"
          chmod 600 "$RUNNER_TEMP/star-release.jks"

      - name: Download JRE 8 component
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Prepare language list, build signed Release APK, and package conservative ZIP
        id: package
        env:
          STAR_KEYSTORE_FILE: ${{ runner.temp }}/star-release.jks
          STAR_KEYSTORE_PASSWORD: ${{ secrets.STAR_KEYSTORE_PASSWORD }}
          STAR_KEY_ALIAS: ${{ secrets.STAR_KEY_ALIAS }}
          STAR_KEY_PASSWORD: ${{ secrets.STAR_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          ./scripts/languagelist_updater.sh
          ./gradlew :app_pojavlauncher:assembleRelease --no-daemon --console=plain 2>&1 | tee logs/assemble-release.log
          mkdir -p out/artifact-release
          APK_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.apk"
          ZIP_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.zip"
          APK_OUT="out/artifact-release/$APK_NAME"
          ZIP_OUT="out/artifact-release/$ZIP_NAME"

          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk "$APK_OUT"
          (cd out/artifact-release && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          python3 scripts/package_release_zip.py \
            --apk "$APK_OUT" \
            --apk-sha256 "${APK_OUT}.sha256" \
            --out "$ZIP_OUT" \
            --compression stored

          APK_SHA256=$(awk '{print tolower($1)}' "${APK_OUT}.sha256")
          ZIP_SHA256=$(awk '{print tolower($1)}' "${ZIP_OUT}.sha256")
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Report failed release build details
        if: failure()
        run: |
          if [ -f logs/assemble-release.log ]; then
            tail -n 120 logs/assemble-release.log || true
          fi

      - name: Verify Release APK metadata, signature, ABIs, and conservative ZIP
        env:
          STAR_EXPECTED_CERT_SHA256: ${{ secrets.STAR_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.apk"
          ZIP_NAME="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.zip"
          APK_OUT="out/artifact-release/$APK_NAME"
          ZIP_OUT="out/artifact-release/$ZIP_NAME"
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
            BUILD_TOOLS_DIR="$SDK_DIR/build-tools/34.0.0"
          fi
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_OUT" | tee logs/release-badging.txt
          grep -q "package: name='com.star.launcher'" logs/release-badging.txt
          grep -q "versionCode='${{ steps.meta.outputs.version_code }}'" logs/release-badging.txt
          grep -q "versionName='${{ steps.meta.outputs.version_name }}'" logs/release-badging.txt
          grep -q "minSdkVersion:'21'" logs/release-badging.txt
          grep -q "targetSdkVersion:'34'" logs/release-badging.txt
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs --verbose "$APK_OUT" | tee logs/release-apksigner.txt
          ACTUAL_SHA256=$(grep -E -m1 "(Signer #1|V[0-9]+ Signer:) certificate SHA-256 digest:" logs/release-apksigner.txt | awk '{print tolower($NF)}')
          DEBUG_SHA256="d0d0886a0d7e3486e6627f9b8011027fe3c6b0fb09424530b6d7be14f8c2cc33"
          if [ -z "$ACTUAL_SHA256" ] || [ "${ACTUAL_SHA256#$DEBUG_SHA256}" != "$ACTUAL_SHA256" ]; then
            echo "::error::Release APK appears unsigned or signed with the debug certificate."
            exit 1
          fi
          if [ -n "${STAR_EXPECTED_CERT_SHA256:-}" ] && [ "$ACTUAL_SHA256" != "$(printf '%s' "$STAR_EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')" ]; then
            echo "::error::Release APK certificate SHA-256 does not match STAR_EXPECTED_CERT_SHA256."
            exit 1
          fi
          unzip -l "$APK_OUT" 'lib/*.so' | tee logs/release-native-libs.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$abi/libpojavexec.so" logs/release-native-libs.txt
          done
          python3 scripts/verify_release_package.py \
            --zip "$ZIP_OUT" \
            --expected-apk-name "$APK_NAME" \
            --expected-apk-sha256 "${{ steps.package.outputs.apk_sha256 }}" \
            --expected-package "com.star.launcher" \
            --apksigner "$BUILD_TOOLS_DIR/apksigner" \
            --aapt2 "$BUILD_TOOLS_DIR/aapt2" \
            --forbid-debug-cert \
            ${STAR_EXPECTED_CERT_SHA256:+--expected-cert-sha256 "$STAR_EXPECTED_CERT_SHA256"} | tee logs/release-zip-verify.txt

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/star-release.jks"

      - name: Upload Release APK, conservative ZIP, and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: STAR-Launcher-v${{ steps.meta.outputs.version_name }}
          path: out/artifact-release/
          if-no-files-found: error

      - name: Upload Release Verification Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-logs
          path: logs/

  verify-debug-artifact:
    needs: verify-and-debug
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download uploaded Debug artifact
        uses: actions/download-artifact@v4
        with:
          name: STAR-Launcher-v${{ needs.verify-and-debug.outputs.version_name }}-debug
          path: downloaded

      - name: Verify downloaded Debug artifact matches tested artifact
        run: |
          set -euo pipefail
          APK_NAME="STAR-Launcher-v${{ needs.verify-and-debug.outputs.version_name }}-debug.apk"
          ZIP_NAME="STAR-Launcher-v${{ needs.verify-and-debug.outputs.version_name }}-debug.zip"
          (cd downloaded && sha256sum -c "${APK_NAME}.sha256" && sha256sum -c "${ZIP_NAME}.sha256")
          DL_APK_SHA=$(sha256sum "downloaded/$APK_NAME" | awk '{print tolower($1)}')
          DL_ZIP_SHA=$(sha256sum "downloaded/$ZIP_NAME" | awk '{print tolower($1)}')
          test "$DL_APK_SHA" = "${{ needs.verify-and-debug.outputs.apk_sha256 }}"
          test "$DL_ZIP_SHA" = "${{ needs.verify-and-debug.outputs.zip_sha256 }}"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
            BUILD_TOOLS_DIR="$SDK_DIR/build-tools/34.0.0"
          fi
          python3 scripts/verify_release_package.py \
            --zip "downloaded/$ZIP_NAME" \
            --expected-apk-name "$APK_NAME" \
            --expected-apk-sha256 "${{ needs.verify-and-debug.outputs.apk_sha256 }}" \
            --expected-package "com.star.launcher.debug" \
            --apksigner "$BUILD_TOOLS_DIR/apksigner" \
            --aapt2 "$BUILD_TOOLS_DIR/aapt2"

  verify-release-artifact:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download uploaded Release artifact
        uses: actions/download-artifact@v4
        with:
          name: STAR-Launcher-v${{ needs.release.outputs.version_name }}
          path: downloaded

      - name: Verify downloaded Release artifact matches tested artifact
        env:
          STAR_EXPECTED_CERT_SHA256: ${{ secrets.STAR_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_NAME="STAR-Launcher-v${{ needs.release.outputs.version_name }}.apk"
          ZIP_NAME="STAR-Launcher-v${{ needs.release.outputs.version_name }}.zip"
          (cd downloaded && sha256sum -c "${APK_NAME}.sha256" && sha256sum -c "${ZIP_NAME}.sha256")
          DL_APK_SHA=$(sha256sum "downloaded/$APK_NAME" | awk '{print tolower($1)}')
          DL_ZIP_SHA=$(sha256sum "downloaded/$ZIP_NAME" | awk '{print tolower($1)}')
          test "$DL_APK_SHA" = "${{ needs.release.outputs.apk_sha256 }}"
          test "$DL_ZIP_SHA" = "${{ needs.release.outputs.zip_sha256 }}"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null
            BUILD_TOOLS_DIR="$SDK_DIR/build-tools/34.0.0"
          fi
          python3 scripts/verify_release_package.py \
            --zip "downloaded/$ZIP_NAME" \
            --expected-apk-name "$APK_NAME" \
            --expected-apk-sha256 "${{ needs.release.outputs.apk_sha256 }}" \
            --expected-package "com.star.launcher" \
            --apksigner "$BUILD_TOOLS_DIR/apksigner" \
            --aapt2 "$BUILD_TOOLS_DIR/aapt2" \
            --forbid-debug-cert \
            ${STAR_EXPECTED_CERT_SHA256:+--expected-cert-sha256 "$STAR_EXPECTED_CERT_SHA256"}

  publish-draft-release:
    needs: [verify-and-debug, release, verify-debug-artifact, verify-release-artifact]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read tag version
        id: meta
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          test -n "$TAG_VER"
          echo "version_name=$TAG_VER" >> "$GITHUB_OUTPUT"

      - name: Download signed release artifact
        uses: actions/download-artifact@v4
        with:
          name: STAR-Launcher-v${{ steps.meta.outputs.version_name }}
          path: out

      - name: Verify checksums and prepare release notes
        id: notes
        run: |
          set -euo pipefail
          APK_FILE="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.apk"
          APK_SHA_FILE="${APK_FILE}.sha256"
          ZIP_FILE="STAR-Launcher-v${{ steps.meta.outputs.version_name }}.zip"
          ZIP_SHA_FILE="${ZIP_FILE}.sha256"
          (cd out && sha256sum -c "$APK_SHA_FILE" && sha256sum -c "$ZIP_SHA_FILE")
          test "$(awk '{print tolower($1)}' "out/$APK_SHA_FILE")" = "${{ needs.release.outputs.apk_sha256 }}"
          test "$(awk '{print tolower($1)}' "out/$ZIP_SHA_FILE")" = "${{ needs.release.outputs.zip_sha256 }}"

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          TRACKED_NOTES="docs/RELEASE_NOTES_v${{ steps.meta.outputs.version_name }}.md"
          if [ -f "$TRACKED_NOTES" ]; then
            cp "$TRACKED_NOTES" "$NOTES_FILE"
          else
            printf '# STAR Launcher %s\n' "$GITHUB_REF_NAME" > "$NOTES_FILE"
          fi
          {
            echo ""
            echo "### Release Asset Checksums (\`SHA-256\`)"
            echo '```text'
            cat "out/$APK_SHA_FILE"
            cat "out/$ZIP_SHA_FILE"
            echo '```'
            echo ""
            echo "> **Android Install Note:** Download \`$APK_FILE\` directly on Android, or extract \`$ZIP_FILE\` (conservative \`ZIP_STORED\` archive with no Data Descriptors or ZIP64)."
          } >> "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=out/$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "apk_sha=out/$APK_SHA_FILE" >> "$GITHUB_OUTPUT"
          echo "zip=out/$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_sha=out/$ZIP_SHA_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.notes.outputs.apk }}" \
              "${{ steps.notes.outputs.apk_sha }}" \
              "${{ steps.notes.outputs.zip }}" \
              "${{ steps.notes.outputs.zip_sha }}" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --title "STAR Launcher $GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.file }}" --draft
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.notes.outputs.apk }}" \
              "${{ steps.notes.outputs.apk_sha }}" \
              "${{ steps.notes.outputs.zip }}" \
              "${{ steps.notes.outputs.zip_sha }}" \
              --draft \
              --verify-tag \
              --title "STAR Launcher $GITHUB_REF_NAME" \
              --notes-file "${{ steps.notes.outputs.file }}"
          fi
